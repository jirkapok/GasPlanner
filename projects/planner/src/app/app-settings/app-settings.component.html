<div class="row mt-5">
    <form [formGroup]="settingsForm" class="row">
        <div class="col col-12 col-sm-7 col-lg-5 col-xl-4 col-xxl-3 mt-3">
            <div class="card">
                <app-card-header
                    [cardTitle]="'personalization.cardTitle' | translate"
                    [headerIcon]="flagIcon"
                    helpDocument="settings">
                </app-card-header>
                <div class="card-body">
                    <div class="form-check">
                        <input type="radio" id="metricRadio" class="form-check-input" formControlName="imperialUnits"
                               [value]="false" />
                        <label class="custom-control-label" for="metricRadio" value="metric">{{ 'personalization.metricUnits' | translate }}</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="imperialRadio" class="form-check-input" formControlName="imperialUnits"
                               [value]="true" />
                        <label class="custom-control-label" for="imperialRadio">{{ 'personalization.imperialUnits' | translate }}<br>
                            {{ 'personalization.imperialExperimental' | translate }}</label>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" mdbLabel>{{ 'personalization.language' | translate }}:</label>
                        <div>
                            <app-language-dropdown></app-language-dropdown>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col col-12 col-sm-7 col-lg-5 col-xl-4 col-xxl-3 mt-3">
            <div class="card">
                <app-card-header
                    [cardTitle]="'settings.limitsCardTitle' | translate"
                    [headerIcon]="diverIcon"
                    helpDocument="settings">
                </app-card-header>
                <div class="card-body">
                    <div class="mb-4 col col-12 col-md-6 col-lg-12 col-xl-6">
                        <label for="maxDensity" class="form-label" mdbLabel>{{ 'settings.maxGasDensityLabel' | translate }} [{{units.density}}]:
                        </label>
                        <input class="form-control" type="number" id="maxDensity"
                               formControlName="maxDensity" required [min]="ranges.maxDensity[0]"
                               [max]="ranges.maxDensity[1]" [step]="densityStep" [class.is-invalid]="maxDensityInvalid" />
                        <div class="invalid-feedback position-absolute">{{ 'validation.needsNumber' | translate }} {{ranges.maxDensityLabel}}</div>
                    </div>
                    <div class="mb-4 col col-12 col-md-6 col-lg-12 col-xl-6">
                        <label for="primaryTankReserve" class="form-label" mdbLabel>{{ 'settings.primaryTankReserveLabel' | translate }} [{{units.pressure}}]:
                        </label>
                        <input class="form-control" type="number" id="primaryTankReserve"
                               formControlName="primaryTankReserve" required [min]="ranges.tankPressure[0]"
                               [max]="ranges.tankPressure[1]" step="1" [class.is-invalid]="primaryTankReserveInvalid" />
                        <div class="invalid-feedback position-absolute">{{ 'validation.needsNumber' | translate }} {{ranges.tankPressureLabel}}</div>
                    </div>
                    <div class="mb-4 col col-12 col-md-6 col-lg-12 col-xl-6">
                        <label for="stageTankReserve" class="form-label" mdbLabel>{{ 'settings.stageTankReserveLabel' | translate }} [{{units.pressure}}]:
                        </label>
                        <input class="form-control" type="number" id="stageTankReserve"
                               formControlName="stageTankReserve" required [min]="ranges.tankPressure[0]"
                               [max]="ranges.tankPressure[1]" step="1" [class.is-invalid]="stageTankReserveInvalid" />
                        <div class="invalid-feedback position-absolute">{{ 'validation.needsNumber' | translate }} {{ranges.tankPressureLabel}}</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col col-12 col-sm-7 col-lg-5 col-xl-4 col-xxl-3 mt-3">
            <div class="card">
                <app-card-header
                    [cardTitle]="'settings.ignoredIssuesCardTitle' | translate"
                    [headerIcon]="diverIcon"
                    helpDocument="settings">
                </app-card-header>
                <div class="card-body">
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" id="icdIgnored" formControlName="icdIgnored" mdbCheckbox />
                        <label class="custom-control-label" for="icdIgnored">{{ 'settings.icdLabel' | translate }}</label>
                    </div>
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" id="densityIgnored" formControlName="densityIgnored" mdbCheckbox />
                        <label class="custom-control-label" for="densityIgnored">{{ 'settings.densityExceededLabel' | translate }}</label>
                    </div>
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" id="noDecoIgnored" formControlName="noDecoIgnored" mdbCheckbox />
                        <label class="custom-control-label" for="noDecoIgnored">{{ 'settings.noDecoReachedLabel' | translate }}</label>
                    </div>
                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" id="missingAirBreak" formControlName="missingAirBreak" mdbCheckbox />
                        <label class="custom-control-label" for="missingAirBreak">{{ 'settings.missingAirBreakLabel' | translate }}</label>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="row">
    <div class="form-group mt-3">
        <button type="button" class="btn btn-primary me-2" (click)="location.back()">{{ 'common.back' | translate }}</button>
        <button id="resetToDefault" type="button" class="btn btn-secondary me-2" (click)="resetToDefault()" >{{ 'settings.resetToDefault' | translate }}</button>
        <button id="useButton" type="button" class="btn btn-secondary" (click)="use()" [hidden]="!settingsForm.valid">{{ 'common.use' | translate }}</button>
    </div>
</div>
