<div class="card-header d-flex flex-wrap justify-content-between align-items-center row-gap-2">
    <div>
        <fa-icon [icon]="headerIcon" class="me-3"></fa-icon>
        <span>{{ cardTitle }}</span>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mw-100 row-gap-2">
        <ng-content></ng-content>

        <button
            type="button"
            class="btn btn-sm btn-secondary ms-2"
            (click)="openHelp()"
            title="{{ 'cardHeader.showHelp' | translate }}"
            aria-label="{{ 'cardHeader.showHelp' | translate }}">
            <fa-icon [icon]="helpIcon" class="fa-lg"></fa-icon>
        </button>
    </div>
</div>
