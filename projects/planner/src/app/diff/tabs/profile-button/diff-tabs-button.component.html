<div class="ms-2 h-100">
    <div class="header-container position-relative">
        @if (state === 'primary') {
            <div class="position-absolute w-100 rounded-top text-white text-center initialism bg-primary"
                animate.enter="flip-in" animate.leave="flip-out">
                {{ 'diffTabs.profileA' | translate }}
            </div>
        } @else if (state === 'secondary') {
            <div class="position-absolute w-100 rounded-top text-white text-center initialism bg-success"
                animate.enter="flip-in" animate.leave="flip-out">
                {{ 'diffTabs.profileB' | translate }}
            </div>
        }
    </div>
    <button type="button" class="btn"
        [class.btn-outline-secondary]="selected"
        [class.btn-secondary]="!selected"
        (click)="selectProfile()">
        {{ this.title }}
    </button>
</div>
