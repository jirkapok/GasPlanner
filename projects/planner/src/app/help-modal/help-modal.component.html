<div class="modal-header">
    <h4 class="modal-title w-100" id="myModalLabel">{{ 'helpModal.title' | translate }}</h4>
    <button type="button" class="btn-close" aria-label="{{ 'helpModal.close' | translate }}" (click)="modalRef.close()"></button>
</div>

<div class="modal-body">
    <ngx-md [path]="path" [sanitizeHtml]="false"></ngx-md>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modalRef.close()">
        {{ 'helpModal.close' | translate }}
    </button>
</div>
